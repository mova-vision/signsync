<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MOVA — Manage Gestures</title>
  <link rel="stylesheet" href="/static/css/admin.css?v=7">
  <script src="/static/js/mv-dropdown.js?v=1" defer></script>
  <script src="/static/js/mv-workspace.js?v=1" defer></script>
  <style>
    /* page layout — natural scroll, fewer + larger tiles */
    .mv-app {
      grid-template-rows: auto auto;
    }

    .mv-heading-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 16px;
    }

    .mv-tile img.mv-preview {
      height: clamp(150px, 24vh, 230px);
    }

    .mv-tile {
      gap: 9px;
    }

    .mv-tile h3 {
      font-size: 13.5px;
    }

    .mv-sentence {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
      font-size: 12px;
      color: var(--mv-accent-2);
      cursor: pointer;
    }

    .mv-sentence span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .mv-meta {
      display: flex;
      gap: 5px;
      flex-wrap: wrap;
    }

    .mv-filter {
      border: 1px solid var(--mv-line);
      padding: 8px 10px;
      font: inherit;
      font-size: 13px;
      color: var(--mv-text);
      background: var(--mv-row);
      width: auto;
      min-width: 200px;
    }

    .mv-filter:focus {
      outline: none;
      border-color: var(--mv-accent-line);
    }

    @media (max-width: 720px) {
      .mv-heading-row {
        align-items: flex-start;
        flex-direction: column;
      }
      .mv-grid {
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      }
    }
  </style>
</head>
<body>
  <header class="mv-topbar">
    <a class="mv-brand" href="/admin">
      <img src="/static/img/mova-logo.svg" alt="" width="15">
      MOVA
      <span class="mv-badge">gesture admin</span>
    </a>
    <nav class="mv-nav" aria-label="Main navigation">
      <a href="/admin/register">Register</a>
      <a class="active" href="/admin/gestures">Manage Gestures</a>
      <a href="/admin/groups">Groups</a>
      <a class="mv-play-link" href="/playground" title="Open the live Playground">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="6.5" width="13" height="11" rx="2.5"/><path d="m15.5 10.5 6-3v9l-6-3"/></svg>
        Playground
      </a>
      <span id="mvWorkspaces" style="min-width:170px"></span>
    </nav>
  </header>

  <main class="mv-app">
    <section class="mv-heading mv-heading-row">
      <div style="display:flex;align-items:center;gap:10px">
        <span class="mv-head-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
        </span>
        <div>
          <h1 style="font-size:clamp(19px,2vw,24px)">Gesture library</h1>
          <p style="margin-top:2px"><span id="libNote">All registered gestures — newest first.</span></p>
        </div>
      </div>
      <div style="display:flex;gap:10px;align-items:center">
        <select id="groupFilter" class="mv-filter" aria-label="Filter by group">
          <option value="">All groups</option>
        </select>
        <a href="/admin/register"><button class="mv-primary" type="button">+ Register gesture</button></a>
      </div>
    </section>

    <section class="mv-card" style="padding:16px">
      <div id="grid" class="mv-grid" aria-live="polite"></div>
    </section>
  </main>

  <!-- Edit Gesture Modal -->
  <div id="modal" class="mv-modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <form id="editForm" class="mv-dialog">
      <h2 id="modalTitle">Edit gesture</h2>

      <div class="mv-field">
        <label for="editName">Gesture name</label>
        <input id="editName" required>
      </div>
      <div class="mv-field" style="margin-top:12px">
        <label for="editLabels">Meanings / labels (comma-separated)</label>
        <textarea id="editLabels" rows="3"></textarea>
      </div>

      <!-- one-shot voice section (only for gestures inside one_shot groups) -->
      <div id="editShotBlock" style="display:none;margin-top:14px;padding:12px;border:1px solid var(--mv-accent-line);background:var(--mv-accent-soft)">
        <b style="display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--mv-accent)">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M3 10v4a1 1 0 0 0 1 1h3l4.3 3.6a.8.8 0 0 0 1.2-.7V6.1a.8.8 0 0 0-1.2-.7L7 9H4a1 1 0 0 0-1 1z"/><path d="M15.5 8.5a5 5 0 0 1 0 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          One-shot sentence
        </b>
        <p class="mv-note" style="margin:6px 0 8px">When this sign is detected, this sentence is spoken. Editing it regenerates the voice.</p>
        <textarea id="editSentence" rows="2" maxlength="300" placeholder="e.g. Hi, how are you?"></textarea>
        <div style="display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap">
          <select id="editGender" style="width:auto;border:1px solid var(--mv-line);padding:7px 10px;font:inherit;font-size:12.5px;color:var(--mv-text);background:var(--mv-row)">
            <option value="male" selected>Male voice</option>
            <option value="female">Female voice</option>
          </select>
          <button id="editShotSave" class="mv-primary" type="button">Generate voice</button>
          <button id="editShotPlay" class="mv-secondary" type="button" hidden>▸ Play</button>
          <span id="editShotStatus" class="mv-note"></span>
        </div>
      </div>

      <div class="mv-dialog-actions">
        <button id="cancel" class="mv-secondary" type="button">Close</button>
        <button class="mv-primary" type="submit">Save changes</button>
      </div>
    </form>
  </div>

  <script>
    const $ = id => document.getElementById(id);
    let gestures = [];
    let spaces = [];
    let editingGesture = null;
    let currentFilter = '';

    const element = (tag, className, text) => {
      const el = document.createElement(tag);
      if (className) el.className = className;
      if (text !== undefined) el.textContent = text;
      return el;
    };

    const spaceOf = gid => spaces.find(s => (s.gesture_ids || []).includes(gid)) || null;

    async function load() {
      try {
        const [ge, sp] = await Promise.all([
          fetch('/api/gestures'),
          fetch('/api/spaces')
        ]);
        if (!ge.ok) throw new Error('Could not load gestures');
        gestures = (await ge.json()).gestures || [];
        spaces = sp.ok ? (await sp.json()).spaces || [] : [];
        // newest first (register appends, so created_at keeps rank)
        gestures.sort((a, b) => (b.created_at || 0) - (a.created_at || 0));
        fillFilter();
        render();
      } catch (error) {
        $('grid').replaceChildren(element('div', 'mv-empty', error.message));
      }
    }

    function fillFilter() {
      const sel = $('groupFilter');
      const prev = currentFilter;
      sel.replaceChildren(
        Object.assign(document.createElement('option'), { value: '', textContent: 'All groups' }),
        Object.assign(document.createElement('option'), { value: '__standard__', textContent: 'Standard' }),
        ...spaces.map(s => Object.assign(document.createElement('option'), {
          value: s.id,
          textContent: `${s.key} (${s.join_mode})`
        }))
      );
      sel.value = prev;
      if (sel.value !== prev) currentFilter = '';
    }

    function visibleGestures() {
      if (!currentFilter) return gestures;
      if (currentFilter === '__standard__') return gestures.filter(g => !spaceOf(g.id));
      return gestures.filter(g => (spaceOf(g.id) || {}).id === currentFilter);
    }

    function render() {
      const grid = $('grid');
      grid.replaceChildren();

      const list = visibleGestures();
      if (!list.length) {
        grid.append(element('div', 'mv-empty', currentFilter ? 'No gestures in this group yet.' : 'No gestures registered yet.'));
        return;
      }

      list.forEach(g => {
        const sp = spaceOf(g.id);
        const shot = (g.shot && g.shot.sentence) ? g.shot : null;

        const card = element('article', 'mv-tile');
        if (g.preview_path) {
          const img = element('img', 'mv-preview');
          img.src = g.preview_path;
          img.alt = `${g.name} gesture preview`;
          card.append(img);
        }

        const head = element('div', 'mv-tile-head');
        const title = element('h3', '', g.name);
        const badge = element(
          'span',
          `mv-pill ${g.hand_count === 2 ? 'accent' : ''}`,
          `${g.hand_count} hand${g.hand_count === 1 ? '' : 's'}`
        );
        head.append(title, badge);
        card.append(head);

        // compact meta — group it belongs to (or standard)
        const meta = element('div', 'mv-meta');
        if (sp) {
          meta.append(element('span', 'mv-pill accent', sp.key));
          meta.append(element('span', 'mv-pill', sp.join_mode));
          const role = (g.role || '').replace('space-', '');
          if (role && role !== 'member') meta.append(element('span', 'mv-pill', role));
        } else {
          meta.append(element('span', 'mv-pill', 'standard'));
        }
        card.append(meta);

        // meanings / labels
        const labels = element('div', 'mv-labels');
        (g.labels || []).forEach(label => labels.append(element('span', 'mv-tag', label)));
        if (!(g.labels || []).length) {
          labels.append(element('span', 'mv-tag', 'no labels'));
        }
        card.append(labels);

        // one-shot spoken sentence — single compressed line, click to play
        if (shot) {
          const line = element('div', 'mv-sentence');
          line.title = `Play: ${shot.sentence}`;
          line.innerHTML = '<svg viewBox="0 0 24 24" width="13" height="13" fill="currentColor" style="flex:none"><path d="M3 10v4a1 1 0 0 0 1 1h3l4.3 3.6a.8.8 0 0 0 1.2-.7V6.1a.8.8 0 0 0-1.2-.7L7 9H4a1 1 0 0 0-1 1z"/><path d="M15.5 8.5a5 5 0 0 1 0 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
          line.append(element('span', '', `"${shot.sentence}"`));
          line.onclick = () => playSentenceAudio(g);
          card.append(line);
        }

        const actions = element('div', 'mv-actions');
        const edit = element('button', 'mv-secondary', 'Edit');
        const remove = element('button', 'mv-danger', 'Delete');
        edit.type = remove.type = 'button';
        edit.onclick = () => openEdit(g);
        remove.onclick = () => removeGesture(g);
        actions.append(edit, remove);
        card.append(actions);

        grid.append(card);
      });
    }

    function playSentenceAudio(g) {
      const shot = (g.shot && g.shot.audio_key)
        ? new Audio(`/audio/${encodeURIComponent(g.shot.audio_key)}?t=${Date.now()}`)
        : new Audio(`/api/gestures/${g.id}/sentence/audio?t=${Date.now()}`);
      shot.play();
    }

    $('groupFilter').onchange = e => {
      currentFilter = e.target.value;
      render();
    };

    function openEdit(g) {
      editingGesture = g;
      $('editName').value = g.name;
      $('editLabels').value = (g.labels || []).join(', ');

      const sp = spaceOf(g.id);
      const oneShot = sp && sp.join_mode === 'one_shot';
      $('editShotBlock').style.display = oneShot ? '' : 'none';
      if (oneShot) {
        $('editSentence').value = (g.shot && g.shot.sentence) || '';
        $('editGender').value = (g.shot && g.shot.gender) || 'male';
        $('editShotStatus').textContent = (g.shot && g.shot.sentence) ? 'voice is ready' : 'no voice yet';
        $('editShotPlay').hidden = !(g.shot && g.shot.audio_key);
      }

      $('modal').classList.add('open');
      $('editName').focus();
    }

    function closeEdit() {
      $('modal').classList.remove('open');
      editingGesture = null;
    }

    // regenerate the one-shot voice from the modal
    $('editShotSave').onclick = async () => {
      if (!editingGesture) return;
      const sentence = $('editSentence').value.trim();
      const status = $('editShotStatus');
      if (!sentence) { status.textContent = 'type the sentence first'; return; }
      $('editShotSave').disabled = true;
      status.textContent = 'generating voice…';
      try {
        const res = await fetch(`/api/gestures/${editingGesture.id}/sentence`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ sentence, gender: $('editGender').value })
        });
        const d = await res.json();
        if (!res.ok) throw new Error(d.detail || 'failed');
        status.textContent = 'voice updated ✓';
        $('editShotPlay').hidden = false;
        editingGesture.shot = { sentence, gender: $('editGender').value, audio_key: d.audio_url?.split('/').pop() || (editingGesture.shot || {}).audio_key, ready: true };
        render();
      } catch (e) {
        status.textContent = `error: ${e.message}`;
      }
      $('editShotSave').disabled = false;
    };

    $('editShotPlay').onclick = () => {
      if (editingGesture) playSentenceAudio(editingGesture);
    };

    $('editForm').onsubmit = async event => {
      event.preventDefault();
      if (!editingGesture) return;
      const name = $('editName').value.trim();
      const labels = $('editLabels').value
        .split(',')
        .map(x => x.trim())
        .filter(Boolean);

      if (!name) return;

      const response = await fetch(`/api/gestures/${editingGesture.id}`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, labels })
      });

      if (!response.ok) {
        alert('Could not save changes.');
        return;
      }
      closeEdit();
      load();
    };

    async function removeGesture(g) {
      if (!confirm(`Delete "${g.name}"? This cannot be undone.`)) return;
      const response = await fetch(`/api/gestures/${g.id}`, {
        method: 'DELETE'
      });
      if (!response.ok) {
        alert('Could not delete this gesture.');
        return;
      }
      load();
    }

    $('cancel').onclick = closeEdit;
    $('modal').onclick = e => {
      if (e.target === $('modal')) closeEdit();
    };

    load();
  </script>
</body>
</html>
